function projectPage(){let list=admin.weddings.filter(w=>[w.names,w.venue].join(' ').toLowerCase().includes(search.toLowerCase()));return `<div class="page-head"><div><span class="admin-label">PRUUTPAARID & PROJEKTID</span><h1>Igal armastuslool oma plaan.</h1><p>Hallake pulmade infot, tegevusi ja korraldaja sisemärkmeid.</p></div><button class="btn primary" data-action="new-project">${icon('plus')}Uus pulmaprojekt</button></div><div class="toolbar"><input id="admin-search" aria-label="Otsi pulmaprojekti" class="search" placeholder="Otsi pruutpaari või pulmakohta…" value="${esc(search)}"></div><div class="project-grid">${list.map((w,i)=>{let p=progress(w),late=records[w.id].tasks.filter(t=>due(t)==='late').length;return `<article class="project-card"><div class="project-card-top"><span class="monogram ${i%3===1?'rose':i%3===2?'sand':''}">${esc(initials(w))}</span>${phase(w)}</div><h2>${esc(w.names)}</h2><div class="project-meta"><span>${icon('calendar')}${dateText(w.date,true)}</span><span>${icon('pin')}${esc(w.venue)}</span><span>${icon('users')}${w.guests} külalist</span></div><div class="project-progress"><small><span>${p.done} / ${p.total} tegevust tehtud</span><span>${p.pct}%</span></small><div class="mini-progress"><i style="width:${p.pct}%"></i></div></div><div class="card-bottom"><span class="${late?'attention':'muted'}">${late?late+' üle tähtaja':'Tähtajad kontrolli all'}</span><button data-action="project" data-w="${w.id}">Halda projekti ↗</button></div><a class="btn" href="${clientUrl(w.id)}">Ava kliendivaade ${icon('arrow')}</a></article>`}).join('')||'<div class="empty">Sobivaid projekte ei leitud.</div>'}</div>`}
function taskPage(){let list=tasks().filter(t=>(projectFilter==='all'||t.wedding.id===projectFilter)&&(ownerFilter==='all'||t.group===ownerFilter)&&(statusFilter==='all'||statusFilter==='late'&&due(t)==='late'||t.status===statusFilter)&&[t.title,t.assignee,t.wedding.names].join(' ').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>(a.status==='Valmis')-(b.status==='Valmis')||a.date.localeCompare(b.date));return `<div class="page-head"><div><span class="admin-label">ÜHINE TEGEVUSPLAAN</span><h1>Õige asi, õigel ajal.</h1><p>Määrake vastutajad, leppige kokku tähtajad ja hoidke ajalugu alles.</p></div><button class="btn primary" data-action="new-task">${icon('plus')}Lisa tegevus</button></div><section class="panel"><div class="panel-head"><h2>${list.length} tegevust</h2><small>Ava tegevus, et näha arutelu</small></div><div class="admin-toolbar"><input id="admin-search" aria-label="Otsi tegevust" placeholder="Otsi tegevust, paari või vastutajat…" value="${esc(search)}"><select id="project-filter" aria-label="Pulmaprojekt">${projectOptions()}</select><select id="owner-filter" aria-label="Vastutajate grupp">${[['all','Kõik vastutajad'],['planner','Korraldaja'],['couple','Pruutpaar & pulmalised']].map(([v,n])=>`<option value="${v}" ${v===ownerFilter?'selected':''}>${n}</option>`).join('')}</select><select id="status-filter" aria-label="Staatus">${[['all','Kõik staatused'],['Ootel','Ootel'],['Töös','Töös'],['Valmis','Valmis'],['late','Üle tähtaja']].map(([v,n])=>`<option value="${v}" ${v===statusFilter?'selected':''}>${n}</option>`).join('')}</select></div><div class="table-wrap"><table class="admin-table"><thead><tr><th><span class="visually-hidden">Valmis</span></th><th>Tegevus / pruutpaar</th><th>Vastutaja</th><th>Tähtaeg</th><th>Staatus</th><th>Arutelu</th></tr></thead><tbody>${list.map(t=>`<tr><td><button class="check ${t.status==='Valmis'?'done':''}" data-action="toggle" data-w="${t.wedding.id}" data-id="${t.id}" aria-label="${t.status==='Valmis'?'Märgi ootele':'Märgi valmis'}: ${esc(t.title)}">${t.status==='Valmis'?icon('check'):''}</button></td><td>${taskBtn(t)}<small>${esc(t.wedding.names)} · ${esc(t.category)}</small></td><td>${esc(t.assignee)}<br><small>${t.group==='planner'?'Korraldaja':'Pruutpaar / pulmalised'}</small></td><td><span class="pill ${due(t)}">${dateText(t.date,true)}</span>${due(t)==='late'?'<br><small style="color:var(--red)">Üle tähtaja</small>':''}</td><td><span class="pill ${t.status==='Töös'?'warn':''}">${esc(t.status)}</span></td><td><button class="btn text" data-action="task" data-w="${t.wedding.id}" data-id="${t.id}" aria-label="Ava kommentaarid: ${esc(t.title)}">${icon('chat')}${t.history.filter(h=>h.type==='comment').length}</button></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">Nende filtritega tegevusi ei leitud.</div>'}</div></section>`}
function contactsPage(){let cs=admin.weddings.flatMap(w=>records[w.id].contacts.map(c=>({...c,wedding:w}))).filter(c=>(projectFilter==='all'||c.wedding.id===projectFilter)&&[c.name,c.role,c.person].join(' ').toLowerCase().includes(search.toLowerCase()));return `<div class="page-head"><div><span class="admin-label">TEENUSEPAKKUJAD</span><h1>Head inimesed teie ümber.</h1><p>Iga pulma kontaktid, broneeringud ja kokkulepped.</p></div><button class="btn primary" data-action="new-contact">${icon('plus')}Lisa kontakt</button></div><div class="toolbar"><input id="admin-search" class="search" aria-label="Otsi kontakti" placeholder="Otsi nime või teenust…" value="${esc(search)}"><select id="project-filter" aria-label="Pulmaprojekt">${projectOptions()}</select></div><div class="contact-grid admin-contact-grid">${cs.map(c=>`<button class="contact-card" data-action="contact" data-w="${c.wedding.id}" data-id="${c.id}"><span class="contact-symbol">${icon(c.symbol)}</span><span class="arrow">↗</span><span class="eyebrow">${esc(c.role)}</span><h3>${esc(c.name)}</h3><small>${esc(c.person)}</small><small>${esc(c.email||'E-post lisamata')}</small><span class="pill ${c.status==='Kinnitatud'?'':'warn'}">${esc(c.status)}</span><span class="contact-project">${esc(c.wedding.names)}</span></button>`).join('')||'<div class="empty">Kontakte ei leitud. Lisa esimene kontakt.</div>'}</div>`}
function historyPage(){return `<div class="page-head"><div><span class="admin-label">KOMMENTAARID & MUUDATUSED</span><h1>Ühine mälu, selged kokkulepped.</h1><p>Kõigi pulmade tegevusajalugu, kõige uuemad sündmused ees.</p></div></div><div class="toolbar"><select id="project-filter" aria-label="Pulmaprojekt">${projectOptions()}</select></div><section class="panel admin-timeline">${events().filter(h=>projectFilter==='all'||h.task.wedding.id===projectFilter).map(feed).join('')||'<div class="empty">Tegevuste ajalugu on veel tühi.</div>'}</section>`}
function render(){const nav=[['dashboard','grid','Töölaud'],['projects','heart','Pulmaprojektid'],['tasks','tasks','Tegevused'],['contacts','users','Kontaktid'],['history','clock','Ajalugu']];$('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand serif">${icon('flower')}<div>meie päev<small>KORRALDAJA KESKKOND</small></div></div><div class="wedding-mini"><div class="eyebrow">Teie looming. Nende päev.</div><strong>Korraldaja stuudio</strong><small>2027. aasta pulmahooaeg</small></div><nav class="nav" aria-label="Adminmenüü">${nav.map(([p,i,t])=>`<button data-action="nav" data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${icon(i)}${t}</button>`).join('')}</nav><div class="side-bottom"><div class="planner"><span class="avatar">K</span><div><strong>Karen Saksakulm</strong><small>Pulmakorraldaja</small></div></div><div class="tiny-note">Adminvaate prototüüp<br>Näidisandmed · rollide demonstratsioon</div></div></aside><main class="main"><header class="topbar"><span class="breadcrumb">Korraldaja <span style="margin:0 12px">/</span>${nav.find(n=>n[0]===page)[2]}</span><span class="mobile-brand">meie päev</span><div class="top-actions"><span class="demo">ADMIN · DEMO</span><a class="btn" href="${clientUrl(projectFilter==='all'?'w1':projectFilter)}">${icon('users')}Kliendivaade</a><button class="btn" data-action="export">${icon('share')}Ekspordi demo</button><span class="avatar">K</span></div></header><div class="content">${page==='dashboard'?dashboard():page==='projects'?projectPage():page==='tasks'?taskPage():page==='contacts'?contactsPage():historyPage()}<p class="footer-note">Adminvaate prototüüp · Muudatused salvestuvad sellesse brauserisse · Kasutajaõigused ja ühine andmebaas pole ühendatud</p></div></main></div>`}
function showOverlay(html,drawer=false){lastFocus=document.activeElement;$('overlay-root').innerHTML=`<div class="overlay"><section class="${drawer?'drawer':'modal'}" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${html}</section></div>`;document.body.style.overflow='hidden';document.querySelector('.overlay button,.overlay input')?.focus()}
function closeOverlay(){$('overlay-root').innerHTML='';document.body.style.overflow='';active=null;if(lastFocus?.isConnected)lastFocus.focus()}
const closeButton='<button type="button" class="close" data-action="close" aria-label="Sulge">×</button>';
function projectForm(id){const w=wBy(id)||{names:'',date:'2027-06-19',venue:'',guests:60,email:'',phone:'',stage:'Päring',budget:20000,note:''};let p=id?progress(w):null;active={kind:'project',wid:id};showOverlay(`<div class="modal-head"><span class="eyebrow">${id?'Pulmaprojekti haldus':'Uus pulmaprojekt'}</span>${closeButton}</div><h2 id="dialog-title">${id?esc(w.names):'Uue loo algus.'}</h2>${id?`<div class="detail-summary"><span><strong>${p.pct}%</strong>tegevustest tehtud</span><span><strong>${records[id].contacts.length}</strong>teenusepakkujat</span><span><strong>${w.guests}</strong>külalist</span></div><div class="admin-subnav"><button class="btn" data-action="project-tasks" data-w="${id}">Tegevused ${icon('arrow')}</button><a class="btn" href="${clientUrl(id)}">Kliendivaade ↗</a></div>`:''}<form id="project-form"><div class="form-grid"><label class="full">Pruutpaari nimed<input name="names" value="${esc(w.names)}" required maxlength="100" placeholder="Mari & Karl"></label><label>Pulmapäev<input name="date" type="date" value="${w.date}" required></label><label>Projekti staatus<select name="stage">${['Päring','Planeerimisel','Lõpetatud'].map(s=>`<option ${w.stage===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="full">Pulmakoht<input name="venue" value="${esc(w.venue)}" required maxlength="150"></label><label>Külaliste arv<input name="guests" type="number" min="0" max="10000" value="${w.guests}" required></label><label>Planeeritud eelarve (€)<input name="budget" type="number" min="0" step="1" value="${w.budget}" required></label><label>E-post<input name="email" type="email" value="${esc(w.email)}"></label><label>Telefon<input name="phone" value="${esc(w.phone)}" type="tel" maxlength="40"></label></div><div class="internal-note"><h3>Korraldaja sisemärkmed</h3><p>Need märkmed ei ilmu pruutpaari kliendivaates.</p><label class="visually-hidden" for="internal-note">Sisemärkmed</label><textarea id="internal-note" name="note" maxlength="5000" placeholder="Ettevalmistused, tähelepanekud, järgmise kohtumise fookus…">${esc(w.note)}</textarea></div><div class="form-actions"><button type="button" class="btn" data-action="close">Tühista</button><button class="btn primary">${id?'Salvesta projekt':'Loo pulmaprojekt'}</button></div></form>`,true)}
function taskForm(wid,id){const w=wBy(wid)||wBy(projectFilter)||admin.weddings[0],t=id?records[w.id].tasks.find(t=>t.id===id):{title:'',assignee:'Karen',date:today(),group:'planner',status:'Ootel',category:'Üldine',description:'',history:[]};active={kind:'task',wid:w.id,id};showOverlay(`<div class="modal-head"><span class="eyebrow">${esc(w.names)} · Tegevus</span>${closeButton}</div><h2 id="dialog-title">${id?esc(t.title):'Uus tegevus'}</h2><form id="task-form"><div class="form-grid">${!id?`<label class="full">Pulmaprojekt<select name="wid">${admin.weddings.map(p=>`<option value="${p.id}" ${p.id===w.id?'selected':''}>${esc(p.names)}</option>`).join('')}</select></label>`:''}<label class="full">Tegevuse nimi<input name="title" value="${esc(t.title)}" required maxlength="160"></label><label>Vastutaja<input name="assignee" value="${esc(t.assignee)}" required maxlength="80"></label><label>Tähtaeg<input type="date" name="date" value="${t.date}" required></label><label>Nimekiri<select name="group"><option value="planner" ${t.group==='planner'?'selected':''}>Korraldaja</option><option value="couple" ${t.group==='couple'?'selected':''}>Pruutpaar & pulmalised</option></select></label><label>Staatus<select name="status">${['Ootel','Töös','Valmis'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="full">Kategooria<input name="category" value="${esc(t.category)}" required maxlength="80"></label><label class="full">Kirjeldus<textarea name="description" maxlength="3000">${esc(t.description)}</textarea></label></div><div class="role-note">Tegevus ja selle kommentaarid on nähtavad ka selle paari kliendivaates.</div><div class="form-actions"><button class="btn primary">${id?'Salvesta muudatused':'Lisa tegevus'}</button></div></form>${id?`<h3>Kommentaarid & ajalugu <small>(${t.history.length})</small></h3><div class="history">${t.history.map(h=>`<div class="history-item"><strong>${esc(h.author)}</strong> <small>· ${stamp(h.at)}</small>${h.type==='comment'?`<p>${esc(h.text)}</p>`:`<div class="muted">${esc(h.text)}</div>`}</div>`).join('')}</div><form id="comment-form"><label for="comment-text" class="eyebrow">Kommentaar Karenilt</label><textarea id="comment-text" name="text" placeholder="Uus kokkulepe või küsimus pruutpaarile…" required maxlength="3000"></textarea><div class="form-actions"><button class="btn primary">Lisa kommentaar ${icon('arrow')}</button></div></form>`:''}`,true)}
function contactForm(wid,id){let w=wBy(wid)||wBy(projectFilter)||admin.weddings[0];let c=id?records[w.id].contacts.find(c=>c.id===id):{name:'',role:'',person:'',email:'',phone:'',status:'Valimisel',note:''};active={kind:'contact',wid:w.id,id};showOverlay(`<div class="modal-head"><h2 id="dialog-title">${id?'Kontakt & kokkulepped':'Uus kontakt'}</h2>${closeButton}</div><form id="contact-form"><div class="form-grid">${!id?`<label class="full">Pulmaprojekt<select name="wid">${admin.weddings.map(p=>`<option value="${p.id}" ${p.id===w.id?'selected':''}>${esc(p.names)}</option>`).join('')}</select></label>`:`<p class="role-note full">${esc(w.names)}</p>`}<label>Roll / teenus<input name="role" value="${esc(c.role)}" required maxlength="80"></label><label>Nimi / ettevõte<input name="name" value="${esc(c.name)}" required maxlength="120"></label><label class="full">Kontaktisik<input name="person" value="${esc(c.person)}" maxlength="120"></label><label>E-post<input name="email" type="email" value="${esc(c.email)}"></label><label>Telefon<input name="phone" value="${esc(c.phone)}" maxlength="40"></label><label class="full">Staatus<select name="status">${['Valimisel','Pakkumine ootel','Kinnitatud'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="full">Ühised märkmed ja kokkulepped<textarea name="note" maxlength="4000">${esc(c.note)}</textarea></label></div><div class="form-actions"><button class="btn primary">Salvesta kontakt</button></div></form>`)}
function navigate(p){page=p;search='';projectFilter='all';statusFilter='all';ownerFilter='all';render();window.scrollTo(0,0)}
function exportDialog(){showOverlay(`<div class="modal-head"><h2 id="dialog-title">Adminvaate demofail</h2>${closeButton}</div><p>Laadi alla iseseisev adminvaate HTML-fail koos praeguse tööseisuga.</p><div class="share-box">Fail sisaldab <strong>kõiki pulmaprojekte ja korraldaja sisemärkmeid</strong>. Pruutpaarile mõeldud faili saab alla laadida tema kliendivaates.</div><p class="muted">See on kasutajaliidese prototüüp. Faili muudatused ei sünkrooni teiste seadmetega. Demofaili kliendivaate lingid avavad veebiversiooni.</p><div class="form-actions"><button class="btn primary" data-action="download">Laadi adminvaade alla</button></div>`)}
function exportAdmin(){let html='<!doctype html>\n'+document.documentElement.outerHTML;const payload={admin,records};html=html.replace(/^(?:\/\*DEMO_SNAPSHOT\*\/|window\.DEMO_SNAPSHOT=.*;)$/m,'window.DEMO_SNAPSHOT='+JSON.stringify(payload).replace(/</g,'\\u003c')+';');html=html.replace(/^const ADMIN_KEY='[^']+';/m,"const ADMIN_KEY='meie-paev-admin-export-"+Date.now()+"';");html=html.replace(/<div id="app">[\s\S]*?<script>/,'<div id="app"></div><div id="overlay-root"></div><div id="toast-root" role="status" aria-live="polite"></div><script>');html=html.replace(/<body[^>]*>/,'<body>');const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='meie-paev-admin-prototuup.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Adminvaate demofail on valmis.')}
document.addEventListener('click',e=>{if(e.target.classList.contains('overlay'))return closeOverlay();const b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id,wid=b.dataset.w;if(a==='nav')navigate(b.dataset.page);if(a==='close')closeOverlay();if(a==='project')projectForm(wid);if(a==='new-project')projectForm();if(a==='project-tasks'){closeOverlay();page='tasks';projectFilter=wid;search='';ownerFilter='all';statusFilter='all';render()}if(a==='focus'){navigate('tasks');statusFilter=tasks().some(t=>due(t)==='late')?'late':'all';render()}if(a==='task')taskForm(wid,id);if(a==='new-task')taskForm();if(a==='contact')contactForm(wid,id);if(a==='new-contact')contactForm();if(a==='toggle'){let t=records[wid].tasks.find(t=>t.id===id);t.status=t.status==='Valmis'?'Ootel':'Valmis';t.history.push({author:'Karen',at:new Date().toISOString(),type:'event',text:'Muutis staatust: '+t.status+'.'});persist();render();toast('Staatus uuendatud.')}if(a==='export')exportDialog();if(a==='download')exportAdmin()});
document.addEventListener('change',e=>{if(e.target.id==='project-filter')projectFilter=e.target.value;else if(e.target.id==='owner-filter')ownerFilter=e.target.value;else if(e.target.id==='status-filter')statusFilter=e.target.value;else return;render()});
document.addEventListener('input',e=>{if(e.target.id==='admin-search'){const pos=e.target.selectionStart;search=e.target.value;render();$('admin-search').focus();$('admin-search').setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{const f=e.target;if(!['project-form','task-form','comment-form','contact-form'].includes(f.id))return;e.preventDefault();const v=Object.fromEntries(new FormData(f));for(const k in v)v[k]=v[k].trim();if(f.id==='project-form'){if(!v.names||!v.venue)return toast('Lisa pruutpaari nimed ja pulmakoht.');v.guests=Number(v.guests);v.budget=Number(v.budget);let id=active.wid;if(id)Object.assign(wBy(id),v);else{id='w'+crypto.randomUUID();admin.weddings.push({...v,id});records[id]={tasks:[],contacts:[]}}persist();closeOverlay();page='projects';render();toast('Pulmaprojekt salvestatud.')}if(f.id==='task-form'){if(!v.title||!v.assignee||!v.category)return toast('Täida tegevuse nimi, vastutaja ja kategooria.');const wid=v.wid||active.wid;delete v.wid;let id=active.id;if(id){let t=records[wid].tasks.find(t=>t.id===id);const labels={title:'Tegevus',assignee:'Vastutaja',date:'Tähtaeg',group:'Nimekiri',status:'Staatus',category:'Kategooria',description:'Kirjeldus'};let changes=Object.keys(v).filter(k=>v[k]!==t[k]).map(k=>`${labels[k]}: ${k==='group'?(v[k]==='planner'?'Korraldaja':'Pruutpaar & pulmalised'):v[k]}`);Object.assign(t,v);if(changes.length)t.history.push({author:'Karen',at:new Date().toISOString(),type:'event',text:changes.join(' · ')})}else{id='t'+crypto.randomUUID();records[wid].tasks.push({...v,id,history:[{author:'Karen',at:new Date().toISOString(),type:'event',text:'Tegevus loodud. Vastutaja: '+v.assignee+'. Tähtaeg: '+v.date+'.'}]})}persist();render();taskForm(wid,id);toast('Tegevus salvestatud.')}if(f.id==='comment-form'){if(!v.text)return;let {wid,id}=active;records[wid].tasks.find(t=>t.id===id).history.push({author:'Karen',at:new Date().toISOString(),type:'comment',text:v.text});persist();render();taskForm(wid,id);document.querySelector('.drawer').scrollTop=99999;toast('Kommentaar lisatud.')}if(f.id==='contact-form'){if(!v.role||!v.name)return toast('Lisa roll ja nimi.');const wid=v.wid||active.wid;delete v.wid;if(active.id)Object.assign(records[wid].contacts.find(c=>c.id===active.id),v);else records[wid].contacts.push({...v,id:'c'+crypto.randomUUID(),symbol:'flower'});persist();closeOverlay();render();toast('Kontakt salvestatud.')}});
document.addEventListener('keydown',e=>{const modal=document.querySelector('[role="dialog"]');if(!modal)return;if(e.key==='Escape')closeOverlay();if(e.key==='Tab'){const els=[...modal.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('storage',e=>{if(e.key===ADMIN_KEY||admin.weddings.some(w=>keyFor(w.id)===e.key)){if(document.querySelector('[role="dialog"]'))toast('Teises vaates tehti muudatusi. Sulge detailvaade ja värskenda lehte enne salvestamist.');else location.reload()}});
persist();render();

</script></body></html>
