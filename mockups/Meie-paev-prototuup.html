function dateText(d){return new Date(d+'T12:00:00').toLocaleDateString('et-EE',{day:'numeric',month:'short'})}function stamp(d){return new Date(d).toLocaleString('et-EE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Tallinn'})}

n class="stat-label">Lähenevad tähtajad</span><strong>${soon}</strong><small>Järgmise 7 päeva jooksul või varem</small></div><div class="stat">${icon('users')}<span class="stat-label">Meie pulmameeskond</span><strong>${confirmed} <span style="font-size:16px;color:#9a7986">/ ${data.contacts.length}</span></strong><small>Teenusepakkujat kinnitatud</small></div></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Järgmised sammud</h2><button class="btn text" data-action="nav" data-page="tasks">Kõik tegevused ${icon('arrow')}</button></div><p class="panel-sub">Üks asi korraga. Teie unistuste päeva suunas.</p>${tabs()}${data.tasks.filter(t=>t.group===group&&t.status!=='Valmis').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(taskRow).join('')||'<div class="empty">Kõik tehtud. Võtke hetk tähistamiseks!</div>'}</section><section class="panel"><div class="panel-head"><h2>Viimased jutud</h2><button class="btn text" data-action="nav" data-page="history">Vaata kõiki ↗</button></div><div class="feed">${allEvents().slice(0,3).map(feedItem).join('')}</div><div class="next-meeting"><div class="calendar-tile"><small>Nov</small>06</div><div><strong>Järgmine ühine planeerimine</strong><br><small>6. november · 17.00 · näidiskohtumine</small></div></div></section></div><section class="contact-preview"><div class="panel-head"><h2>Teie päeva head haldjad</h2><button class="btn text" data-action="nav" data-page="contacts">Kõik kontaktid ${icon('arrow')}</button></div><div class="contact-grid">${data.contacts.slice(0,4).map(contactCard).join('')}</div></section>`}
function taskPage(){let list=data.tasks.filter(t=>t.group===group&&(statusFilter==='Kõik'||statusFilter==='Üle tähtaja'&&due(t)==='late'||t.status===statusFilter)&&[t.title,t.assignee,t.category].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>(a.status==='Valmis')-(b.status==='Valmis')||a.date.localeCompare(b.date));return `<div class="page-head"><div><h1>Väikestest sammudest suur päev.</h1><p>Pruutpaari, pulmaliste ja korraldaja ühine tegevusplaan.</p></div><button class="btn primary" data-action="new-task">${icon('plus')}Lisa tegevus</button></div><section class="panel task-list">${tabs()}<div class="toolbar" style="padding:0 23px"><label class="search"><input id="search" aria-label="Otsi tegevust" placeholder="Otsi tegevust või vastutajat…" value="${esc(query)}"></label><select id="status-filter" aria-label="Filtreeri staatuse järgi">${['Kõik','Ootel','Töös','Valmis','Üle tähtaja'].map(s=>`<option ${s===statusFilter?'selected':''}>${s}</option>`).join('')}</select><span class="muted" style="font-size:12px">${list.length} tegevust</span></div>${list.map(taskRow).join('')||'<div class="empty">Ühtegi sobivat tegevust ei leitud.</div>'}</section>`}

function render(){let nav=[['overview','grid','Ülevaade'],['tasks','tasks','Tegevused'],['contacts','users','Kontaktid'],['history','clock','Ajalugu']];document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand serif">${icon('flower')}<div>meie päev<small>PULMADE PLANEERIMINE</small></div></div><div class="wedding-mini"><div class="eyebrow">Meie ühine teekond</div><strong>Mari & Karl</strong><small>19.06.2027 · Metsaveere mõis</small></div><nav class="nav" aria-label="Peamenüü">${nav.map(([p,i,t])=>`<button data-action="nav" data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${icon(i)}${t}${p==='tasks'?`<span class="count">${data.tasks.filter(t=>t.status!=='Valmis').length}</span>`:''}</button>`).join('')}</nav><div class="side-bottom"><div style="font:italic 17px/1.5 Georgia;color:#9a7986;margin:0 8px 30px">Kõige ilusamad lood<br>algavad koos.</div><div class="planner"><span class="avatar">K</span><div><strong>Teie korraldaja Karen</strong><small>Olen teie jaoks olemas</small></div></div><div class="tiny-note">Loodud hoole ja armastusega ♡</div></div></aside><main class="main"><header class="topbar"><span class="breadcrumb">Meie pulm <span style="margin:0 12px;color:#ad989f">/</span> ${nav.find(n=>n[0]===page)[2]}</span><span class="mobile-brand">meie päev</span><div class="top-actions"><span class="demo">NÄIDISVAADE</span><button class="btn" data-action="share">${icon('share')}Jaga prototüüpi</button><span class="avatar" style="background:#eee8e7">M & K</span></div></header><div class="content">${page==='overview'?overview():page==='tasks'?taskPage():page==='contacts'?contactPage():historyPage()}<p class="footer-note">Meie päev · Interaktiivne prototüüp · Näidisandmed · Muudatused salvestuvad sellesse brauserisse</p></div></main></div>`}
function showOverlay(html,drawer=false){lastFocus=document.activeElement;document.getElementById('overlay-root').innerHTML=`<div class="overlay"><section class="${drawer?'drawer':'modal'}" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${html}</section></div>`;document.body.style.overflow='hidden';document.querySelector('.overlay button,.overlay input')?.focus()}

function taskDetail(id){let t=data.tasks.find(t=>t.id===id);if(!t)return;activeTask=id;showOverlay(`<div class="modal-head"><span class="eyebrow">${esc(t.category)} · Tegevuse detailid</span>${closeButton}</div><h2 id="dialog-title">${esc(t.title)}</h2><form id="edit-task" class="form-grid"><label class="full">Tegevus<input name="title" value="${esc(t.title)}" required maxlength="160"></label><label>Vastutaja<input name="assignee" value="${esc(t.assignee)}" required maxlength="80"></label><label>Tähtaeg<input type="date" name="date" value="${esc(t.date)}" required></label><label>Staatus<select name="status">${['Ootel','Töös','Valmis'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></label><label>Nimekiri<select name="group"><option value="couple" ${t.group==='couple'?'selected':''}>Pruutpaar & pulmalised</option><option value="planner" ${t.group==='planner'?'selected':''}>Korraldaja</option></select></label><label class="full">Kirjeldus<textarea name="description" maxlength="3000">${esc(t.description)}</textarea></label><div class="full" style="text-align:right"><button class="btn primary">Salvesta muudatused</button></div></form><h3>Kommentaarid & ajalugu <small>(${t.history.length})</small></h3><div class="history">${t.history.map(h=>`<div class="history-item"><strong>${esc(h.author)}</strong> <small>· ${stamp(h.at)}</small>${h.type==='comment'?`<p>${esc(h.text)}</p>`:`<div class="muted">${esc(h.text)}</div>`}</div>`).join('')}</div><form id="comment-form"><label for="author" class="eyebrow">Kommentaari autor (demovaade)</label><select id="author" name="author" class="comment-author"><option>Mari</option><option>Karl</option><option>Karen</option><option>Pulmaline</option></select><label for="comment-text" class="eyebrow">Lisa kommentaar</label><textarea name="comment" id="comment-text" placeholder="Mõte, küsimus või uus kokkulepe…" required maxlength="3000"></textarea><div class="form-actions"><button class="btn primary">Lisa kommentaar ${icon('arrow')}</button></div></form>`,true)}

function download(){let html='<!doctype html>\n'+document.documentElement.outerHTML;const seedStart=html.indexOf('const SEED='),seedEnd=html.indexOf(";\nconst KEY=",seedStart);html=html.slice(0,seedStart)+'const SEED='+JSON.stringify(data).replace(/</g,'\\u003c')+html.slice(seedEnd);html=html.replace(/const KEY='[^']+'/,"const KEY='meie-paev-shared-"+Date.now()+"'");html=html.replace(/<div id="app">[\s\S]*?<script>/,'<div id="app"></div><div id="overlay-root"></div><div id="toast-root" role="status" aria-live="polite"></div>\n<script>');html=html.replace(/<body[^>]*>/,'<body>');const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='meie-paev-prototuup.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Jagatav HTML-fail on valmis.')}
document.addEventListener('click',e=>{if(e.target.classList.contains('overlay')){closeOverlay();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='nav'){page=b.dataset.page;query='';statusFilter='Kõik';render();window.scrollTo(0,0)}if(a==='group'){group=b.dataset.group;render()}if(a==='task')taskDetail(id);if(a==='toggle'){let t=data.tasks.find(t=>t.id===id);t.status=t.status==='Valmis'?'Ootel':'Valmis';t.history.push({author:'Teie',at:new Date().toISOString(),text:'Muutis staatust: '+t.status+'.',type:'event'});persist();render();toast(t.status==='Valmis'?'Üks samm tehtud!':'Tegevus märgitud ootele.')}if(a==='close')closeOverlay();if(a==='new-task')newTask();if(a==='contact')contactDetail(id);if(a==='new-contact')contactDetail();if(a==='share')share();if(a==='download')download()});
document.addEventListener('change',e=>{if(e.target.id==='status-filter'){statusFilter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{let f=e.target;if(!['edit-task','comment-form','new-task-form','contact-form'].includes(f.id))return;e.preventDefault();const v=Object.fromEntries(new FormData(f));for(let k in v)v[k]=v[k].trim();if((f.id==='new-task-form'||f.id==='edit-task')&&(!v.title||!v.assignee)){toast('Palun lisa tegevuse nimi ja vastutaja.');return}if(f.id==='edit-task'){let t=data.tasks.find(t=>t.id===activeTask);let changes=[];const names={title:'Tegevus',assignee:'Vastutaja',date:'Tähtaeg',status:'Staatus',group:'Nimekiri',description:'Kirjeldus'};for(let k in v){if(t[k]!==v[k]){let val=k==='group'?(v[k]==='couple'?'Pruutpaar & pulmalised':'Korraldaja'):v[k];changes.push(names[k]+': '+(k==='description'?'kirjeldust uuendati':val));t[k]=v[k]}}if(changes.length)t.history.push({author:'Teie',at:new Date().toISOString(),text:changes.join(' · '),type:'event'});persist();render();taskDetail(t.id);toast(changes.length?'Muudatused salvestatud.':'Muudatusi ei olnud.')}if(f.id==='comment-form'){if(!v.comment)return;let t=data.tasks.find(t=>t.id===activeTask);t.history.push({author:v.author,at:new Date().toISOString(),text:v.comment,type:'comment'});persist();render();taskDetail(t.id);document.querySelector('.drawer').scrollTop=99999;toast('Kommentaar lisatud.')}if(f.id==='new-task-form'){const t={...v,id:'t'+crypto.randomUUID(),status:'Ootel',history:[{author:'Teie',at:new Date().toISOString(),text:'Ülesanne loodud. Tähtaeg: '+v.date+'. Vastutaja: '+v.assignee+'.',type:'event'}]};data.tasks.push(t);persist();group=v.group;page='tasks';query='';statusFilter='Kõik';closeOverlay();render();toast('Uus tegevus lisatud.')}if(f.id==='contact-form'){if(!v.name||!v.role){toast('Palun lisa nimi ja roll.');return}let c=data.contacts.find(c=>c.id===f.dataset.id);if(c)Object.assign(c,v);else data.contacts.push({...v,id:'c'+crypto.randomUUID(),symbol:'flower'});persist();closeOverlay();render();toast('Kontakt salvestatud.')}});
document.addEventListener('keydown',e=>{let modal=document.querySelector('[role="dialog"]');if(!modal)return;if(e.key==='Escape')closeOverlay();if(e.key==='Tab'){let items=[...modal.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled);let first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
